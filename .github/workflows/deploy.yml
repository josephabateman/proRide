name: Build and deploy site

# Runs whenever content/code is pushed to main (including saves from the /admin CMS)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # .npmrc supplies legacy-peer-deps and the OpenSSL flag react-scripts 4 needs.
      # This also downloads the headless Chrome used to pre-render pages.
      - name: Install dependencies
        run: npm install

      # Builds the app, then scripts/prerender.js writes a static HTML file for
      # every page plus 404.html and sitemap.xml. Fails if any page is broken.
      - name: Build and pre-render
        env:
          CI: "false"
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
