  <script>
    // Old links used hash URLs (e.g. /#/services or /#/BalanceBikeDays).
    // Send them to the matching real page before anything else loads.
    (function () {
      var h = location.hash;
      var m = h.match(/^#\/(.*)$/) || h.match(/^#(aboutProRide|aboutPhil)$/i);
      if (!m) return;
      var map = {
        "": "/", services: "/services/", faq: "/faq/", contact: "/contact/", jobs: "/jobs/",
        aboutproride: "/about/", aboutphil: "/about/phil-bateman/",
        balancebikedays: "/services/balance-bike-days/",
        keystage1fundays: "/services/key-stage-1-fun-days/",
        keystage2cyclesportdays: "/services/key-stage-2-cyclesport-days/",
        wholeschooldays: "/services/whole-school-days/",
        schoolclubs: "/services/school-clubs/",
        stafftrainingcpd: "/services/staff-training-cpd/",
        competitiondays: "/services/competition-days/",
        roadsafetytraining: "/services/road-safety-training/"
      };
      var key = m[1].split(/[?#]/)[0].toLowerCase().replace(/[^a-z0-9]/g, "");
      var target = map[key] || "/" + m[1].replace(/^\/+/, "");
      if (target === location.pathname) {
        history.replaceState(null, "", target + location.search);
      } else {
        location.replace(target + location.search);
      }
    })();
  </script>
